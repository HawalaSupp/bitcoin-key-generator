name: Wallet Validation

on:
  push:
    branches: [ main, mvvm-refactor-phase-1 ]
    paths:
      - 'rust-app/**'
      - 'scripts/**'
      - '.github/workflows/wallet-validation.yml'
  pull_request:
    branches: [ main, mvvm-refactor-phase-1 ]
    paths:
      - 'rust-app/**'
      - 'scripts/**'
      - '.github/workflows/wallet-validation.yml'

jobs:
  rust-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Rust workspace
        run: cargo build --manifest-path rust-app/Cargo.toml

      - name: Run Rust tests
        run: cargo test --manifest-path rust-app/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --manifest-path rust-app/Cargo.toml --all-targets

      - name: Production guardrails
        run: scripts/check_production_guards.sh

  wallet-validator:
    runs-on: ubuntu-latest
    needs: rust-build-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-app/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-app/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Generate JSON key material
        run: cargo run --manifest-path rust-app/Cargo.toml --bin rust-app -- --json > key_material.json

      - name: Validate derived wallets
        run: cargo run --manifest-path rust-app/Cargo.toml --bin wallet_validator -- key_material.json

      - name: Upload key material artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallet-key-material
          path: key_material.json

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run Phase 2 security audit
        run: scripts/security_audit.sh
